# =============================================================================
# docker-compose.phase2.yml — Central AI Project Lab Server Deployment
# =============================================================================
# Designed for Phase 2 Central Server execution with:
# - Large enterprise-scale database persistence
# - Dual LLM support (Ollama container with GPU reservation + Cloud LLM APIs)
# - Resource limits & health monitors
# - Dedicated network isolation and production restart policies
#
# Usage on Central Server:
#   docker compose -f docker-compose.phase2.yml up --build -d
#
# Ingest 10,000+ enterprise docs into persistent database:
#   docker compose -f docker-compose.phase2.yml exec vektor-api \
#     python demo/load_enterprise_dataset.py --count 10000 --collection enterprise_kb --data-dir /data
# =============================================================================

version: "3.9"

volumes:
  vektor_phase2_data:
    name: vektor_phase2_data
    driver: local
  vektor_phase2_demo_data:
    name: vektor_phase2_demo_data
    driver: local
  ollama_phase2_models:
    name: ollama_phase2_models
    driver: local

services:

  # --------------------------------------------------------------------------
  # Vektor Core REST API (Production Server)
  # --------------------------------------------------------------------------
  vektor-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vektor-phase2-api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - vektor_phase2_data:/data
    environment:
      - VEKTOR_DATA_DIR=/data
      - PYTHONUNBUFFERED=1
    command: >
      python -m uvicorn vektor.api.app:app
      --host 0.0.0.0
      --port 8000
      --log-level info
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "1.0"
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - phase2-net

  # --------------------------------------------------------------------------
  # Vektor Streamlit Frontend (RAG & Benchmark Evaluation)
  # --------------------------------------------------------------------------
  vektor-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: vektor-phase2-ui
    restart: always
    ports:
      - "8501:8501"
    volumes:
      - vektor_phase2_demo_data:/app/demo_vektor_data
      - vektor_phase2_data:/data
    environment:
      - PYTHONUNBUFFERED=1
      - VEKTOR_DATA_DIR=/app/demo_vektor_data
      - VEKTOR_API_URL=http://vektor-api:8000
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      vektor-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "1.0"
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 20s
      timeout: 5s
      start_period: 40s
      retries: 3
    networks:
      - phase2-net

  # --------------------------------------------------------------------------
  # Ollama Server (Central Server GPU acceleration)
  # --------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: vektor-phase2-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_phase2_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - phase2-net

networks:
  phase2-net:
    name: vektor_phase2_net
    driver: bridge
